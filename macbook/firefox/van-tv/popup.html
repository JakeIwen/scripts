<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Van TV</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Van TV</h1>
  <p id="state" role="status">Connecting…</p>
  <p id="video"></p>
  <p id="time"></p>
  <div class="controls" aria-label="Receiver controls">
    <button id="pause" type="button" disabled>Pause</button>
    <button id="resume" type="button" disabled>Resume</button>
    <button id="stop" type="button" disabled>Stop</button>
  </div>
  <button id="cast-tab" type="button" disabled>Cast this tab</button>
  <p id="notice" role="status"></p>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
