#! /etc/samba/smb.conf

[global]
# Basic Samba configuration
server role = standalone server
passdb backend = tdbsam
obey pam restrictions = yes
security = user
printcap name = /dev/null
load printers = no
server string = Samba Server %v
dns proxy = no
wide links = yes
follow symlinks = yes
unix extensions = no
acl allow execute always = yes
log file = /var/log/samba/%m.log
max log size = 2000
min protocol = SMB2

# Special configuration for Apple's Time Machine
fruit:model = MacSamba
fruit:advertise_fullsync = true
fruit:aapl = yes

## Definde your shares here
# [TimeMachine]
# path = /mnt/usbhfs/timemachine/%U
# valid users = %U
# writable = yes
# durable handles = yes
# kernel oplocks = no
# kernel share modes = no
# posix locking = no
# vfs objects = catia fruit streams_xattr
# ea support = yes
# browseable = yes
# read only = no
# inherit acls = yes
# fruit:time machine = yes

# [hfs1tb]
# path = /mnt/hfs1tb
# writable = yes
# ea support = no
# browseable = yes
# read only = no
# inherit acls = yes
# vfs objects = catia fruit streams_xattr  
# fruit:metadata = netatalk
# fruit:locking = netatalk
# fruit:posix_rename = yes 
# fruit:veto_appledouble = no
# fruit:time machine = yes

[mbp2tbkup]
path = /mnt/mbp2tbkup
preexec = /home/pi/scripts/samba_require_mount.sh mbp2tbkup
preexec close = yes
browseable = yes
writable = yes
guest ok = no
create mask = 0775
directory mask = 0775
vfs objects = catia fruit streams_xattr
fruit:time machine = yes
# Samba counts live bundles, not the retained ~470 GiB archive. Keep room for
# both histories on this 2 TB filesystem. After restore verification and
# deliberate retirement of that archive, this limit can rise to 1500G.
# 64 MiB bands were established using 256G ONLY during native image creation;
# see docs/backup/TIME_MACHINE.md before replacing a bundle.
fruit:time machine max size = 1100G
# Retired bundles are preserved below archive/ during migrations, but must not
# be discoverable as candidate histories by Time Machine clients.
veto files = /archive/

[MovingParts]
path = /mnt/movingparts
vfs objects = fruit streams_xattr
fruit:resource = file
fruit:metadata = netatalk
fruit:time machine = no
# Keep AppleDouble files accessible to Mac archive/copy tools.
fruit:veto_appledouble = no
preexec = /home/pi/scripts/samba_require_mount.sh movingparts
preexec close = yes
valid users = pi
public = yes
browseable = yes
writable = yes
create mask = 0777
create mode = 0777
directory mask = 0777
directory mode = 0777

[BigBoi]
path = /mnt/bigboi
vfs objects = fruit streams_xattr
fruit:resource = file
fruit:metadata = netatalk
fruit:time machine = no
fruit:veto_appledouble = no
preexec = /home/pi/scripts/samba_require_mount.sh bigboi
preexec close = yes
valid users = pi
public = yes
browseable = yes
writable = yes
create mask = 0777
create mode = 0777
directory mask = 0777
directory mode = 0777

[EXFAT512]
path = /mnt/EXFAT512
preexec = /home/pi/scripts/samba_require_mount.sh EXFAT512
preexec close = yes
valid users = pi
public = yes
browseable = yes
writable = yes
create mask = 0777
create mode = 0777
directory mask = 0777
directory mode = 0777

[pihome]
path = /home/pi
valid users = pi
public = yes
browseable = yes
writable = yes
create mask = 0777
create mode = 0777
directory mask = 0777
directory mode = 0777
