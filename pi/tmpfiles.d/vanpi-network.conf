# RAM-only fallbacks and syslog capture. Never create a removable mountpoint.
d /run/vanpi-network 0750 pi pi -
# omfile size-limit reopen does not reapply fileGroup on Pi rsyslog 8.2302.
# Inherit adm for every new generation. The installer repairs existing files
# through verified directory FDs; tmpfiles z refuses this ownership hierarchy.
d /run/vanpi-network/spool 02750 root adm -
