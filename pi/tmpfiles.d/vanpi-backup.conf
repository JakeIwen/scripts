# Shared by root-run backup jobs and pi-initiated lifecycle checks. Keep the
# inode root-owned so /run/lock's sticky-directory protections cannot make a
# root abort helper reject a lock previously opened by pi.
f /run/lock/vanpi_backup.lock 0660 root pi -
# Resource-specific backup locks (pi/docs/backup/CONCURRENCY.md). The registry
# is fixed: jobs fail closed on an unknown kind, label or data set instead of
# creating lock files at runtime.
d /run/lock/vanpi-backup 0770 root pi -
f /run/lock/vanpi-backup/job-borg.lock 0660 root pi -
f /run/lock/vanpi-backup/job-exfat.lock 0660 root pi -
f /run/lock/vanpi-backup/job-pi-cloud.lock 0660 root pi -
f /run/lock/vanpi-backup/job-time-machine.lock 0660 root pi -
f /run/lock/vanpi-backup/job-clone.lock 0660 root pi -
f /run/lock/vanpi-backup/disk-bigboi.lock 0660 root pi -
f /run/lock/vanpi-backup/disk-hdd1tb.lock 0660 root pi -
f /run/lock/vanpi-backup/disk-mbp2tbkup.lock 0660 root pi -
f /run/lock/vanpi-backup/disk-movingparts.lock 0660 root pi -
f /run/lock/vanpi-backup/disk-EXFAT512.lock 0660 root pi -
f /run/lock/vanpi-backup/data-borg-repo.lock 0660 root pi -
f /run/lock/vanpi-backup/cloud-upload.lock 0660 root pi -
