# Receive classic syslog from OpenWrt on UDP/514. The listener intentionally
# binds all local addresses so it also starts before vanpi obtains its DHCP
# lease; this dedicated ruleset discards every source except the router.
module(load="imudp")

template(
  name="OpenWrtDendelionFormat"
  type="string"
  string="%timegenerated:::date-rfc3339% %fromhost-ip% %hostname% %syslogtag%%msg%\n"
)

# The legacy text file above records receiver time only. Keep both clocks for
# future network diagnosis. RFC3164 reported_at has an inferred year/timezone;
# it must not be presented as a synchronized, independently verified clock.
template(name="OpenWrtNetworkJSON" type="list" option.jsonf="on") {
  constant(outname="schema_version" value="1" format="jsonf")
  property(outname="received_at" name="timegenerated" dateFormat="rfc3339" format="jsonf")
  property(outname="reported_at" name="timereported" dateFormat="rfc3339" format="jsonf")
  property(outname="protocol_version" name="protocol-version" format="jsonf")
  property(outname="source_ip" name="fromhost-ip" format="jsonf")
  property(outname="hostname" name="hostname" format="jsonf")
  property(outname="tag" name="syslogtag" format="jsonf")
  property(outname="message" name="msg" format="jsonf")
}

ruleset(name="OpenWrtDendelion") {
  if ($fromhost-ip == "192.168.6.1") then {
    action(
      type="omfile"
      file="/run/vanpi-network/spool/dendelion.log"
      template="OpenWrtDendelionFormat"
      createDirs="on"
      dirCreateMode="0750"
      fileCreateMode="0640"
      fileOwner="root"
      fileGroup="adm"
      rotation.sizeLimit="1048576"
      rotation.sizeLimitCommand="/usr/local/libexec/vanpi-rotate-network-log legacy"
    )
    # Omit login churn and ordinary DNS questions/answers. Only diagnostic
    # messages enter the additive spool; the legacy file remains unchanged.
    if ($programname == "clientwan-path" or $programname == "uplink-https" or
        $programname == "hostapd" or $programname == "wpa_supplicant" or
        $programname == "netifd" or $programname == "kernel" or
        $programname startswith "mwan3" or
        ($programname startswith "dnsmasq" and
         re_match($msg, "(failed|no servers|SERVFAIL|REFUSED|maximum number|not responding)"))) then {
      action(
        type="omfile"
        file="/run/vanpi-network/spool/network.jsonl"
        template="OpenWrtNetworkJSON"
        createDirs="on"
        dirCreateMode="0750"
        fileCreateMode="0640"
        fileOwner="root"
        fileGroup="adm"
        rotation.sizeLimit="1048576"
        rotation.sizeLimitCommand="/usr/local/libexec/vanpi-rotate-network-log json"
      )
    }
  }
  stop
}

input(type="imudp" port="514" ruleset="OpenWrtDendelion")
