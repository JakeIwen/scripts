# Receive classic syslog from OpenWrt on UDP/514. The listener intentionally
# binds all local addresses so it also starts before vanpi obtains its DHCP
# lease; this dedicated ruleset discards every source except the router.
module(load="imudp")

template(
  name="OpenWrtDendelionFormat"
  type="string"
  string="%timegenerated:::date-rfc3339% %fromhost-ip% %hostname% %syslogtag%%msg%\n"
)

ruleset(name="OpenWrtDendelion") {
  if ($fromhost-ip == "192.168.6.1") then {
    action(
      type="omfile"
      file="/var/log/openwrt/dendelion.log"
      template="OpenWrtDendelionFormat"
      createDirs="on"
      dirCreateMode="0750"
      fileCreateMode="0640"
      fileOwner="root"
      fileGroup="adm"
    )
  }
  stop
}

input(type="imudp" port="514" ruleset="OpenWrtDendelion")
