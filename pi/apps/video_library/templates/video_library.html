<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Movies & TV">
  <meta name="theme-color" content="#111820">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/app-icon.svg">
  <link rel="stylesheet" href="{{ url_for('static', filename='video_library.css') }}">
  <title>Van Movies & TV</title>
</head>
<body>
  <header class="app-header">
    <a class="dashboard-link" id="dashboard-link" href="#" aria-label="Back to Van Dashboard">‹</a>
    <div class="header-title"><span class="eyebrow">vanpi library</span><h1>Movies &amp; TV</h1></div>
    <div class="header-actions">
      <button class="icon-button cc-button" id="subtitles" type="button" aria-pressed="false" title="English subtitles on the next video">CC</button>
      <button class="icon-button" id="rescan" type="button" title="Rescan media library" aria-label="Rescan media library">↻</button>
    </div>
  </header>

  <main>
    <div class="connection"><span class="dot" id="connection-dot"></span><span id="connection">Connecting to vanpi…</span></div>
    <div class="search-wrap" id="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search" type="search" placeholder="Search movies, shows, or episodes" autocomplete="off" autocapitalize="none">
      <button id="clear-search" type="button" aria-label="Clear search">×</button>
    </div>
    <nav class="view-tabs" aria-label="Library sections">
      <button type="button" data-view="home" aria-pressed="true">Home</button>
      <button type="button" data-view="movies" aria-pressed="false">Movies</button>
      <button type="button" data-view="shows" aria-pressed="false">Shows</button>
      <button type="button" data-view="documentaries" aria-pressed="false">Docs</button>
      <button type="button" data-view="new" aria-pressed="false">New</button>
    </nav>
    <div id="content"><div class="empty-state">Reading the media drive…</div></div>
  </main>

  <div class="sheet-backdrop" id="show-backdrop">
    <section class="sheet" id="show-sheet" role="dialog" aria-modal="true" aria-labelledby="show-title">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <div><span class="eyebrow">episode browser</span><h2 id="show-title">Show</h2></div>
        <button class="sheet-close" id="show-close" type="button" aria-label="Close episode browser">×</button>
      </div>
      <div class="sheet-actions">
        <button type="button" id="show-continue">▶ Continue</button>
        <button type="button" id="show-shuffle">⚄ Random episode</button>
      </div>
      <div class="episode-list" id="episode-list"><div class="empty-state">Loading episodes…</div></div>
    </section>
  </div>

  <section class="player-shell" id="player" aria-label="VLC playback controls">
    <div class="player">
      <div class="now-playing">
        <div class="now-art" id="now-art" aria-hidden="true">▶</div>
        <div class="now-copy">
          <strong id="now-title">Nothing playing</strong>
          <span id="now-meta">Choose something from the library</span>
        </div>
        <span class="transport-state" id="transport-state">Idle</span>
      </div>
      <div class="timeline-row">
        <span id="elapsed">0:00</span>
        <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="Playback position">
        <span id="remaining">—</span>
      </div>
      <div class="primary-controls">
        <button type="button" data-control="previous" aria-label="Previous episode" title="Previous">|◀</button>
        <button type="button" data-seek="-20" aria-label="Back 20 seconds">−20</button>
        <button class="play-button" id="play-pause" type="button" data-control="toggle" aria-label="Play or pause">▶</button>
        <button type="button" data-seek="20" aria-label="Forward 20 seconds">+20</button>
        <button type="button" data-control="next" aria-label="Next episode" title="Next">▶|</button>
      </div>
      <div class="secondary-controls">
        <button type="button" data-seek="-300">−5 min</button>
        <button class="stop-button" type="button" data-control="stop">■ Stop</button>
        <label>Speed
          <select id="rate" aria-label="Playback speed">
            <option value=".75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.1">1.1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <label>Sleep
          <select id="sleep" aria-label="Sleep timer">
            <option value="0">Off</option>
            <option value="15">15m</option>
            <option value="30">30m</option>
            <option value="45">45m</option>
            <option value="60">1h</option>
            <option value="90">1½h</option>
            <option value="120">2h</option>
          </select>
        </label>
        <button type="button" data-seek="300">+5 min</button>
      </div>
      <div class="volume-row">
        <span id="volume-source">Sonos</span>
        <input id="volume" type="range" min="0" max="100" value="47" aria-label="Rear Sonos volume">
        <span id="volume-value">—</span>
        <button id="fullscreen" type="button" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>
      </div>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='video_library.js') }}"></script>
</body>
</html>
