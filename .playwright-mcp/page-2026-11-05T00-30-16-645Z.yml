    - region [ref=f1e1133]:
      - heading "Keeping this current" [level=2] [ref=f1e1134]
      - paragraph [ref=f1e1135]:
        - text: When a custom BTT, iTerm, zsh or harness mapping changes, update the
        - link "canonical catalog" [ref=f1e1136] [cursor=pointer]:
