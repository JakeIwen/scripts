    - region [ref=f2e1123]:
      - heading "Terminal" [level=2] [ref=f2e1124]
      - paragraph [ref=f2e1125]:
        - code [ref=f2e1126]: python3 ~/dev/visual-guides/keyboard_reference.py
        - text: prints the reference (Python 3.9+, no dependencies). The Mac
        - code [ref=f2e1127]: keys
        - text: shell function is prepared but review and activation are pending; it is a command, not a chord. Add a search phrase or
        - code [ref=f2e1128]: "--all"
        - text: to include disabled and pending mappings.
      - paragraph [ref=f2e1129]:
        - text: Default output shows grouped keys, actions and statuses. Use
        - code [ref=f2e1130]: "--details"
        - text: for each row’s conditions, limitations, sources and verification date;
        - code [ref=f2e1131]: "--notes"
        - text: prints catalog-wide caveats after the results.
        - code [ref=f2e1132]: "--json"
        - text: always includes complete records and notes.
    - region [ref=f2e1133]:
      - heading "Keeping this current" [level=2] [ref=f2e1134]
      - paragraph [ref=f2e1135]:
        - text: When a custom BTT, iTerm, zsh or harness mapping changes, update the
        - link "canonical catalog" [ref=f2e1136] [cursor=pointer]:
          - /url: ../reference/keyboard-shortcuts.json
        - text: in the same task and verify this guide and the terminal output. A verified date records a source check, not a claim that the shortcut was exercised in every app. Review every catalog string before publishing; automated privacy checks catch common leaks, not every private detail.
      - paragraph [ref=f2e1137]:
        - text: Keycaps separated by an arrow are consecutive sequence steps, not one simultaneous chord. Search can join those steps, such as
        - code [ref=f2e1138]: cosnt
        - text: for C → O → S → N → T → Space. Built-in macOS shortcuts are outside this custom reference.
