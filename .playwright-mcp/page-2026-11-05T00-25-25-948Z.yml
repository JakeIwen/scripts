    - status [ref=e18]: 100 of 113 mappings. Disabled mappings hidden.
    - generic [ref=e19]:
      - paragraph [ref=e20]: "Coverage: 54 BetterTouchTool mappings, one live hidutil remap and 58 terminal mappings, source-checked 2026-11-04. Twelve new terminal-editing mappings remain disabled pending review, iTerm application and shell activation; include disabled mappings to inspect them."
      - paragraph [ref=e21]: "BTT coverage retains all 43 shortcuts and 11 typed sequences: 37 enabled, 16 conditional and one disabled. All retained rows belong to active presets and none are Trash-linked. Enabled means the saved binding is on, not that its action passed a live test."
      - paragraph [ref=e22]: Consecutive keycaps are sequence steps; plus signs or modifier hyphens indicate a chord. Alphabetic sequence labels name physical keys, not required uppercase characters. Keyboard region selection and mouse selection are distinct; check each mapping’s conditions.
      - paragraph [ref=e23]: Key labels use the US/macOS virtual-key convention. Hardware filters and non-US layouts remain unverified. Seven named targets exist only in inactive presets; explicit dispatch, overlapping seek thresholds and brightness conflicts remain untested. See each row’s limitations.
      - paragraph [ref=e24]: Private expansion text, clipboard contents, saved destinations, network identities and executable payloads are withheld. Insert saved text (private) deliberately does not reveal its content.
      - paragraph [ref=e25]: No custom global menu accelerators or custom Claude/Codex keybindings were found in the inspected configuration. Per-app menu preferences and built-in shortcuts were not inventoried.
      - paragraph [ref=e26]: Action descriptions follow the stored action chains and named targets, not BTT’s container labels. Missing resume targets and unclear Spotify/Chrome behavior are retained and flagged, not repaired or omitted.
      - paragraph [ref=e27]: Existing terminal coverage includes 18 global iTerm mappings, eight profile mappings shared by both configured profiles and 20 zsh mappings. Saved preferences were inspected without sending live keystrokes. Session-specific overrides may differ.
      - paragraph [ref=e28]: Emacs is the intentional zsh default; vi is optional. Proposed terminal editing has isolated PTY coverage without the real clipboard, not proof of installation in existing shells.
      - paragraph [ref=e29]: The proposed cut dispatcher uses a local 20 ms Ctrl-A lookahead without changing global KEYTIMEOUT. Rapid manual Ctrl-A then Ctrl-K is indistinguishable from Cmd-X; delayed pairs or macros need not perform a clipboard cut.
      - paragraph [ref=e30]: Ctrl-Y is not promised to restore a terminal cut. Inspected Claude Code 2.1.314 maps it to chat:defaultToNewerModel; harness and tmux kill/yank behavior remains unverified. No harness bindings were changed.
