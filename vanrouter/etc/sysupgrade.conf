# Extra files that are part of dendelion's recoverable configuration but are
# outside OpenWrt's default sysupgrade backup set. Keep this list narrow: old
# package binaries and a wholesale overlay restore are unsafe across releases.
/etc/firewall.ttl-clientwan.nft
/root/.ssh/known_hosts
/usr/libexec/openwrt-backup-export
/usr/libexec/vanpi-policy-trigger
